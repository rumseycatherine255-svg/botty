<!DOCTYPE html>
<html>
<head>
<title>InSafeHands</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff}
header{background:#16a34a;padding:20px;text-align:center}
.container{max-width:800px;margin:auto;padding:20px}
form{background:#111827;padding:20px;border-radius:12px}
input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#0b1220;color:#fff}
button{width:100%;padding:12px;background:#22c55e;border:none;border-radius:8px}
</style>
</head>
<body>

<header>
<h2>InSafeHands</h2>
</header>

<div class="container">
<form id="f">
<input name="name" placeholder="Name" required>
<input name="email" placeholder="Email" required>
<textarea name="message" placeholder="Message" required></textarea>
<button>Send</button>
</form>
<p id="s"></p>
</div>

<script>
document.getElementById("f").addEventListener("submit", async e=>{
e.preventDefault();
const f=e.target;
const data={
name:f.name.value,
email:f.email.value,
message:f.message.value
};

const r=await fetch("/send-enquiry",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const j=await r.json();
document.getElementById("s").innerText=j.success?"Sent!":"Failed";
});
</script>

</body>
</html>
