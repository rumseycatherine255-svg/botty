<!DOCTYPE html>
<html>
<head>
  <title>InSafeHands Sussex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      color: white;
      background: radial-gradient(circle at top left, #1e3a8a, #020617);
    }

    /* 🔥 FIXED ADMIN BUTTON */
    #adminBtn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: linear-gradient(135deg, #facc15, #f59e0b);
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: black;
      font-size: 14px;
      z-index: 1000;
    }

    header {
      padding: 80px 20px 20px; /* extra top space prevents overlap */
      text-align: center;
    }

    .title {
      font-size: 48px;
      font-weight: bold;
      word-break: break-word;
    }

    .title span {
      color: #22d3ee;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 16px;
      color: #ccc;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      display: block;
      margin: 15px auto 0;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      max-width: 250px;
    }

    #loginBox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #loginInner {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 320px;
    }

    #adminPanel {
      display: none;
    }

    .msg {
      background: #1e293b;
      padding: 10px;
      margin: 6px 0;
      border-radius: 8px;
      word-break: break-word;
    }

    /* 📱 MOBILE FIXES */
    @media (max-width: 600px) {
      .title {
        font-size: 34px;
      }

      header {
        padding: 90px 15px 10px; /* extra top space fixes overlap */
      }

      #adminBtn {
        top: 10px;
        right: 10px;
        padding: 6px 10px;
        font-size: 11px;
        border-radius: 6px;
      }

      .container {
        padding: 10px;
      }

      .card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<button id="adminBtn" onclick="openLogin()">Admin Login</button>

<header>
  <div class="title"><span>InSafeHands</span></div>
</header>

<div class="container">

  <div class="card">
    <h2>Make An Enquiry</h2>
    <input id="qname" placeholder="Name">
    <input id="qemail" placeholder="Email">
    <input id="qphone" placeholder="Phone">
    <input id="qaddress" placeholder="Town Or Address">
    <textarea id="qmsg" placeholder="Message"></textarea>
    <button onclick="sendQuote()">Send Enquiry</button>
  </div>

  <div class="card">
    <h2>Live Chat</h2>
    <input id="cname" placeholder="Name">
    <textarea id="cmsg" placeholder="Message"></textarea>
    <button onclick="sendChat()">Send</button>
  </div>

</div>

<div id="adminPanel" class="container">
  <div class="card">
    <h2>Admin Panel</h2>
    <button onclick="loadData()">Refresh</button>
    <div id="output"></div>
  </div>
</div>

<div id="loginBox">
  <div id="loginInner">
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<script>
function openLogin() {
  document.getElementById("loginBox").style.display = "flex";
}

function login() {
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;

  if (user === "Cat" && pass === "Admin") {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadData();
  } else {
    alert("Invalid login");
  }
}

/* QUOTE */
async function sendQuote() {
  const res = await fetch("/send-quote", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      name: document.getElementById("qname").value,
      email: document.getElementById("qemail").value,
      phone: document.getElementById("qphone").value,
      address: document.getElementById("qaddress").value,
      message: document.getElementById("qmsg").value
    })
  });

  const data = await res.json();

  if (data.success) alert("Quote sent ✔");
  else alert("ERROR: " + data.error);
}

/* CHAT */
async function sendChat() {
  const res = await fetch("/send-message", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      name: document.getElementById("cname").value,
      message: document.getElementById("cmsg").value
    })
  });

  const data = await res.json();

  if (data.success) alert("Message sent ✔");
  else alert("Failed to send");
}

/* ADMIN */
async function loadData() {
  const res = await fetch("/data");
  const data = await res.json();

  let html = "<h3>Chats</h3>";

  for (let user in data.chats) {
    html += `<h4>${user}</h4>`;
    data.chats[user].forEach(m => {
      html += `<div class="msg"><b>${m.sender}:</b> ${m.message}</div>`;
    });
  }

  html += "<h3>Quotes</h3>";

  data.quotes.forEach(q => {
    html += `
      <div class="msg">
        <b>${q.name}</b><br>
        ${q.email}<br>
        ${q.phone}<br>
        ${q.address}<br>
        ${q.message}
      </div>
    `;
  });

  document.getElementById("output").innerHTML = html;
}
</script>

</body>
</html>
