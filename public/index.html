<!DOCTYPE html>
<html>
<head>
  <title>InSafeHands Sussex</title> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1220;
      color: white;
    }

    header {
      padding: 60px 20px;
      text-align: center;
      background: linear-gradient(135deg, #0ea5e9, #1e3a8a);
    }

    h1 { font-size: 40px; margin-bottom: 10px; }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #111827;
      padding: 20px;
      margin: 20px 0;
      border-radius: 12px;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .service {
      background: #1f2937;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
    }

    button {
      background: #0ea5e9;
      border: none;
      padding: 12px;
      width: 100%;
      color: white;
      cursor: pointer;
      border-radius: 8px;
      font-size: 16px;
    }

    button:hover {
      background: #0284c7;
    }
  </style>
</head>

<body>

<header>
  <h1>InSafeHands Sussex</h1>
  <p>Professional Cleaning Services</p>
</header>

<div class="container">

  <div class="card">
    <h2>Our Services</h2>
    <div class="services">
      <div class="service">🏠 House Cleaning</div>
      <div class="service">✨ Deep Cleaning</div>
      <div class="service">🏢 Office Cleaning</div>
      <div class="service">🚪 End of Tenancy</div>
    </div>
  </div>

  <div class="card">
    <h2>Request a Cleaning Quote</h2>

    <input id="name" placeholder="Full Name">
    <input id="email" placeholder="Email">
    <input id="phone" placeholder="Phone Number">
    <textarea id="message" placeholder="What cleaning do you need?"></textarea>

    <button onclick="send()">Send Enquiry</button>

    <p id="status"></p>
  </div>

</div>

<script>
async function send() {
  try {
    const res = await fetch('/send-enquiry', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        message: document.getElementById('message').value
      })
    });

    const data = await res.json();

    document.getElementById('status').innerText =
      data.success ? "✅ Sent successfully!" : "❌ Failed: " + data.error;

  } catch (err) {
    document.getElementById('status').innerText = "❌ Server error";
  }
}
</script>

</body>
</html>
